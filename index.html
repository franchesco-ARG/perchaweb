function notebookLines(){
  let lines = '';
  for(let y=36; y<360; y+=32){ lines += `<line x1="0" y1="${y}" x2="300" y2="${y}" stroke="#211C1B" stroke-width="1" opacity="0.05"/>`; }
  return lines;
}

function renderVisual(item, variant) {
  variant = variant || 0;
  if (item.photos_urls && item.photos_urls.length > 0) {
    const src = item.photos_urls[variant] || item.photos_urls[0];
    return `<img src="uploads/${src}" alt="${esc(item.title)}" class="real-img sketch-svg">`;
  }
  const type = classifyType(item.title, item.category);
  const sk = SKETCHES[type] || SKETCHES.tshirt;
  const colorObj = COLORS.find(c=>c.name===item.color);
  const colorHex = colorObj ? colorObj.hex : '#3B5773';
  const lock = (hashSeed(item.title + item.id) + variant*137) % 10000;
  const uid = 'sk' + item.id + '_' + variant + '_' + lock;
  return `<svg viewBox="0 0 300 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" class="sketch-svg" role="img" aria-label="Boceto de ${esc(item.title)}">
    <defs>
      <filter id="wob_${uid}" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="${lock}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
      <pattern id="hatch_${uid}" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#211C1B" stroke-width="1"/></pattern>
      <clipPath id="clip_${uid}"><path d="${sk.d}"/></clipPath>
    </defs>
    <rect width="300" height="360" fill="#FBF8F2"/>${notebookLines()}
    <g filter="url(#wob_${uid})">
      <path d="${sk.d}" fill="${colorHex}" fill-opacity="0.24" stroke="#211C1B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      ${sk.extra || ''}
      <rect x="0" y="0" width="300" height="360" fill="url(#hatch_${uid})" clip-path="url(#clip_${uid})" opacity="0.13"/>
    </g>
  </svg>`;
}


/* ============================= HELPERS ============================= */
function fmt(n){ return '$U ' + n.toLocaleString('es-UY'); }
function initials(name){ return (name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function showToast(msg){
  state.toastMsg = msg; render();
  setTimeout(()=>{ state.toastMsg = null; const t = document.querySelector('.toast'); if(t) t.classList.remove('show'); setTimeout(render, 250); }, 2200);
}
function navigate(route){ state.route = route; window.scrollTo(0,0); render(); }
function esc(s){ const d=document.createElement('div'); d.textContent = s; return d.innerHTML; }
function toggleCart(id, forceAdd){
  const l = listings.find(x=>x.id===id);
  const idx = state.cart.findIndex(c=>c.id===id);
  if(idx>-1 && !forceAdd){ state.cart.splice(idx,1); showToast('Se quitó del carrito'); }
  else if(idx===-1){ state.cart.push(l); if(!forceAdd) showToast('Se agregó al carrito'); render(); }
  else { render(); }
}
function filteredListings(){
  return listings.filter(l=>{
    if(state.query && !(l.title+' '+l.brand+' '+l.category).toLowerCase().includes(state.query.toLowerCase())) return false;
    if(state.filters.color && l.color !== state.filters.color) return false;
    if(state.filters.size && l.size !== state.filters.size) return false;
    if(state.filters.condition && l.condition !== state.filters.condition) return false;
    if(state.filters.brand && !l.brand.toLowerCase().includes(state.filters.brand.toLowerCase())) return false;
    return true;
  });
}
function escapeHtmlRender(encodedStr) {
  return decodeURIComponent(encodedStr);
}

let autocompleteInstance = null;

  const input = document.getElementById('ship_addr');
  if (input) {
    if (window.google && window.google.maps && window.google.maps.places) {
      autocompleteInstance = new google.maps.places.Autocomplete(input, { types: ['address'] });
    } else {
      setTimeout(initGoogleMapsAutocomplete, 200);
    }
  }
}

function processShipping() {
  const input = document.getElementById('ship_addr');
  const place = autocompleteInstance ? autocompleteInstance.getPlace() : null;
  
  if (!place || !place.formatted_address) {
    document.getElementById('err_address').style.display = 'block';
    input.style.borderColor = 'var(--cherry)';
    return;
  }
  
  state.checkoutAddress = place.formatted_address;
  state.checkoutStep = 2;
  render();
}

async function initMercadoPagoWallet() {
  if (state.checkoutStep !== 2) return;
  const container = document.getElementById('wallet_container');
  if (!container) return;

  if (!mp) {
    container.innerHTML = `<div class="err" style="color:var(--cherry);">No se pudo inicializar MercadoPago. Verificá la API KEY en la configuración.</div>`;
    return;
  }

  const cartIds = state.cart.map(item => item.id);
  try {
    const res = await fetch('api.php?action=create_preference', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cart_ids: cartIds, address: state.checkoutAddress })
    });
    
    const data = await res.json();
    if (!data.success) {
      container.innerHTML = `<div class="err">Error creando pago: ${data.error}</div>`;
      return;
    }
    
    const preferenceId = data.preference_id;
    const orderId = data.order_id;
    container.innerHTML = ''; 

    const bricksBuilder = mp.bricks();
    bricksBuilder.create("wallet", "wallet_container", {
      initialization: { preferenceId: preferenceId },
      callbacks: {
        onReady: () => {},
        onSubmit: () => {},
        onError: (error) => console.error(error),
      },
    });

    const simBtn = document.createElement('button');
    simBtn.className = "btn btn-solid";
    simBtn.style.marginTop = "20px";
    simBtn.innerText = "[DEV] Simular Pago Exitoso (Gatilla Mails)";
    simBtn.onclick = async () => {
      simBtn.innerText = "Procesando...";
      await fetch('api.php?action=confirm_payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: orderId })
      });
      state.cart = [];
      state.checkoutStep = 3;
      await fetchListings(); 
      render();
    };
    container.appendChild(simBtn);

  } catch (error) {
    container.innerHTML = `<div class="err">Error de red conectando al servidor.</div>`;
  }
}


// ============================= CUENTAS Y PUBLICACIÓN =============================
function ViewLogin(mode){
  return `
  <div class="form-shell">
    <h2>${mode==='signup' ? 'Creá tu cuenta' : 'Ingresá a Perchero'}</h2>
    <div class="form-sub">${mode==='signup' ? 'Sumate para comprar y vender prendas.' : 'Bienvenido de nuevo.'}</div>
    ${mode==='signup' ? `<div class="field"><label>Nombre <span class="req">*</span></label><input type="text" id="su_name" placeholder="Tu nombre"></div>` : ''}
    <div class="field"><label>Email <span class="req">*</span></label><input type="email" id="auth_email" placeholder="tuemail@ejemplo.com"></div>
    <div class="field"><label>Contraseña <span class="req">*</span></label><input type="password" id="auth_pass" placeholder="••••••••"></div>
    <button class="btn btn-solid" onclick="doAuth('${mode}')" id="btn_auth">${mode==='signup' ? 'Crear cuenta' : 'Ingresar'}</button>
    <div class="switch-link">
      ${mode==='signup' ? `¿Ya tenés cuenta? <button onclick="navigate('#/login')">Ingresá</button>` : `¿No tenés cuenta? <button onclick="navigate('#/signup')">Creá una</button>`}
    </div>
  </div>`;
}

async function doAuth(mode){
  const email = document.getElementById('auth_email').value.trim();
  const pass = document.getElementById('auth_pass').value.trim();
  if(!email || !pass){ showToast('Completá email y contraseña'); return; }
  
  let name = '';
  if (mode === 'signup') {
    name = document.getElementById('su_name').value.trim();
    if(!name){ showToast('Ingresá tu nombre'); return; }
  }

  const btn = document.getElementById('btn_auth');
  btn.innerText = 'Cargando...';
  
  try {
    const res = await fetch(`api.php?action=${mode==='signup'?'register':'login'}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password: pass })
    });
    
    const data = await res.json();
    if(data.success) {
      state.user = data.user;
      showToast(mode==='signup' ? `¡Cuenta creada! Hola, ${data.user.name}` : `Hola de nuevo, ${data.user.name}`);
      navigate('#/');
    } else {
      showToast(data.error);
      btn.innerText = mode==='signup' ? 'Crear cuenta' : 'Ingresar';
    }
  } catch(e) {
    showToast("Error de conexión al servidor");
    btn.innerText = mode==='signup' ? 'Crear cuenta' : 'Ingresar';
  }
}

async function doLogout(){
  await fetch('api.php?action=logout');
  state.user = null;
  navigate('#/');
  showToast('Cerraste sesión');
}

function ViewVender(){
  if(!state.user){
    return `<div class="empty-state"><h3>Necesitás una cuenta para publicar</h3><button class="btn btn-solid" onclick="navigate('#/login')">Ingresar / Crear cuenta</button></div>`;
  }
  return `
  <div class="form-shell wide">
    <h2>Publicar una prenda</h2>
    <div class="form-sub">Completá todos los campos obligatorios para vender tu prenda.</div>

    <div class="field" id="f_photos">
      <label>Subí una Foto <span class="req">*</span></label>
      <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
        <input type="file" id="photoInput" name="photos[]" multiple accept="image/*" style="display:none" onchange="handlePhotos(this.files)">
        <div style="font-size:13.5px;">📷 Tocá para subir la foto</div>
      </div>
      <div class="photo-chips" id="photoChips"></div>
      <div class="err" id="err_photos" style="display:none;">Subí al menos una foto real de la prenda</div>
    </div>

    <div class="field" id="f_title"><label>Título <span class="req">*</span></label><input type="text" id="v_title" placeholder="Ej: Campera de jean oversize"><div class="err" id="err_title" style="display:none;">Ponele un título a tu prenda</div></div>

    <div class="field-row">
      <div class="field" id="f_category"><label>Categoría <span class="req">*</span></label>
        <select id="v_category"><option value="">Elegir...</option>${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select>
        <div class="err" id="err_category" style="display:none;">Elegí una categoría</div>
      </div>
      <div class="field" id="f_brand"><label>Marca <span class="req">*</span></label><input type="text" id="v_brand" placeholder="Ej: Levi's, o 'Sin marca'"><div class="err" id="err_brand" style="display:none;">Indicá la marca</div></div>
    </div>

    <div class="field" id="f_color">
      <label>Color <span class="req">*</span></label>
      <div class="color-picker">
        ${COLORS.map(c=>`<div class="swatch" data-color="${c.name}" style="background:${c.hex}" title="${c.name}" onclick="selectColor('${c.name}')"></div>`).join('')}
      </div>
      <div class="err" id="err_color" style="display:none;">Elegí el color principal</div>
    </div>

    <div class="field-row">
      <div class="field" id="f_size"><label>Talle <span class="req">*</span></label>
        <select id="v_size"><option value="">Elegir...</option>${SIZES.map(s=>`<option>${s}</option>`).join('')}</select>
        <div class="err" id="err_size" style="display:none;">Elegí el talle</div>
      </div>
      <div class="field" id="f_condition"><label>Estado <span class="req">*</span></label>
        <select id="v_condition"><option value="">Elegir...</option>${CONDITIONS.map(c=>`<option>${c}</option>`).join('')}</select>
        <div class="err" id="err_condition" style="display:none;">Elegí el estado</div>
      </div>
    </div>

    <div class="field" id="f_price"><label>Precio ($U) <span class="req">*</span></label><input type="number" id="v_price" placeholder="Ej: 1200"><div class="err" id="err_price" style="display:none;">Ingresá un precio válido</div></div>
    <div class="field"><label>Descripción</label><textarea id="v_desc" placeholder="Contá el estado, si tiene algún detalle..."></textarea></div>

    <button class="btn btn-solid" onclick="submitListing()" id="btn_submit_listing">Agregar</button>
  </div>`;
}

let selectedColor = null;
function selectColor(name){
  selectedColor = name;
  document.querySelectorAll('#f_color .swatch').forEach(s=>s.classList.toggle('selected', s.dataset.color===name));
}
function handlePhotos(files){
  document.getElementById('photoChips').innerHTML = Array.from(files).map((f,i)=>`<div class="photo-chip">FOTO ${i+1}</div>`).join('');
}

async function submitListing(){
  const vals = {
    title: document.getElementById('v_title').value.trim(),
    category: document.getElementById('v_category').value,
    brand: document.getElementById('v_brand').value.trim(),
    size: document.getElementById('v_size').value,
    condition: document.getElementById('v_condition').value,
    price: document.getElementById('v_price').value,
    desc: document.getElementById('v_desc').value.trim()
  };
  
  const files = document.getElementById('photoInput').files;
  let valid = true;
  const checks = [ ['photos', files.length > 0], ['title', !!vals.title], ['category', !!vals.category], ['brand', !!vals.brand], ['color', !!selectedColor], ['size', !!vals.size], ['condition', !!vals.condition], ['price', vals.price && Number(vals.price)>0] ];
  
  checks.forEach(([key, ok])=>{
    const errEl = document.getElementById('err_'+key);
    const fieldEl = document.getElementById('f_'+key);
    if(!ok){ valid=false; errEl.style.display='block'; fieldEl.classList.add('has-err'); }
    else { errEl.style.display='none'; fieldEl.classList.remove('has-err'); }
  });
  if(!valid){ showToast('Completá los campos obligatorios'); return; }

  const formData = new FormData();
  for (let key in vals) formData.append(key, vals[key]);
  formData.append('color', selectedColor);
  formData.append('seller_id', state.user.id); 

  for(let i=0; i < files.length; i++){ formData.append('photos[]', files[i]); }

  const btn = document.getElementById('btn_submit_listing');
  btn.innerText = "Agregando...";

  try {
    const res = await fetch('api.php?action=add_product', { method: 'POST', body: formData });
    const data = await res.json();
    if(data.success) {
      showToast('¡Prenda agregada con éxito!');
      await fetchListings(); 
      selectedColor = null; 
      navigate('#/');
    } else {
      showToast(data.error);
      btn.innerText = "Agregar";
    }
  } catch(e) {
    showToast("Error subiendo la prenda, fijate tu conexión");
    btn.innerText = "Agregar";
  }
}

function ViewPerfil(){
  if(!state.user){ navigate('#/login'); return ''; }
  const mine = listings.filter(l=>l.seller_id === state.user.id);
  return `
  <div class="profile-head">
    <div class="avatar">${initials(state.user.name)}</div>
    <div><h2 style="font-size:22px;">${esc(state.user.name)}</h2><div style="font-size:13px;color:rgba(33,28,27,0.6);">${esc(state.user.email)}</div></div>
    <button class="btn" style="margin-left:auto;" onclick="doLogout()">Cerrar sesión</button>
  </div>
  <div class="profile-tabs"><button class="active">Mis publicaciones (${mine.length})</button></div>
  ${mine.length ? `<div class="grid">${mine.map(ProductCard).join('')}</div>` : `<div class="empty-state"><h3>Todavía no publicaste nada</h3><button class="btn btn-solid" onclick="navigate('#/vender')">Publicar mi primera prenda</button></div>`}
  `;
}

// ============================= ROUTER Y RENDER =============================
function routeView(){
  switch(state.route){
    case '#/': return ViewHome();
    case '#/buscar': return ViewBuscar();
    case '#/producto': return ViewProducto();
    case '#/carrito': return ViewCarrito();
    case '#/checkout': return ViewCheckout();
    case '#/login': return ViewLogin('login');
    case '#/signup': return ViewLogin('signup');
    case '#/vender': return ViewVender();
    case '#/perfil': return ViewPerfil();
    default: return ViewHome();
  }
}

// Única función render 100% armada, sin overrides raros.
function render(){
  document.getElementById('app').innerHTML = `
    ${Header()}
    <main>${routeView()}</main>
    ${Footer()}
    ${Toast()}
  `;
  
  if (state.route === '#/checkout') {
    if (state.checkoutStep === 1) setTimeout(initGoogleMapsAutocomplete, 100);
    if (state.checkoutStep === 2) setTimeout(initMercadoPagoWallet, 100);
  }
  
  const t = document.getElementById('toastEl');
  if(t) requestAnimationFrame(()=> t.classList.add('show'));
}

// Render Inicial
render();
</script>
